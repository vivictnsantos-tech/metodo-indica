"UserCheck",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["polyline",{points:"16 11 18 13 22 9",key:"1pwet4"}]]);var Ut=P("Users",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var et=P("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var Nt=P("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var s=Ye(Qo()),d={bg:"#10141F",surface:"#1A2135",surface2:"#232C44",border:"#2C3552",gold:"#E8B23D",goldDim:"#6B5624",coral:"#FF5A4E",green:"#4ECB8D",text:"#F3F1EA",muted:"#8A93AA",locked:"#333C56"},j={fontFamily:"'Archivo Black', sans-serif"},q={fontFamily:"'Manrope', sans-serif"},T={fontFamily:"'Space Mono', monospace"},Tf=["Atendente","Vendedor","Vendedor de Autoridade","Fechador de Elite"];function Im(e){return e>=16?3:e>=11?2:e>=5?1:0}var Of=[{id:1,block:"Base",title:"Mentalidade de Elite",Icon:Ft,theory:["Todo vendedor j\xE1 ouviu que \u201Cvendas \xE9 80% mentalidade, 20% t\xE9cnica\u201D \u2014 e tem fundamento real por tr\xE1s disso. O que mais separa quem vende bem de quem n\xE3o vende n\xE3o \xE9 talento, \xE9 resili\xEAncia \xE0 rejei\xE7\xE3o e a cren\xE7a de que o resultado depende das suas pr\xF3prias a\xE7\xF5es, n\xE3o da sorte ou do produto.","Um vendedor com mentalidade fixa encara um \u201Cn\xE3o\u201D como \u201Ceu n\xE3o sei vender\u201D. Um vendedor de elite encara o mesmo \u201Cn\xE3o\u201D como \u201Cessa abordagem n\xE3o funcionou com essa pessoa \u2014 o que eu ajusto pra pr\xF3xima?\u201D. A diferen\xE7a n\xE3o est\xE1 no resultado do dia, est\xE1 no que voc\xEA faz com ele.","A psic\xF3loga Angela Duckworth batizou de grit (perseveran\xE7a combinada com paix\xE3o por um objetivo de longo prazo) o tra\xE7o que mais prediz alto desempenho em qualquer carreira \u2014 mais que talento inicial. Em vendas, isso aparece como um jogo de n\xFAmeros: quanto mais contatos de qualidade voc\xEA faz, mais resultado aparece, mesmo que a taxa de convers\xE3o continue igual. Desistir cedo \xE9 o que mais destr\xF3i resultado, n\xE3o a taxa de rejei\xE7\xE3o em si.","A apar\xEAncia tamb\xE9m faz parte da mentalidade \u2014 n\xE3o por vaidade, mas porque ela \xE9 uma manifesta\xE7\xE3o de empoderamento. Uma pesquisa de comportamento chamada enclothed cognition mostrou que a forma como voc\xEA se veste muda de verdade como voc\xEA pensa e age, n\xE3o s\xF3 como os outros te veem: um vendedor bem arrumado carrega essa postura pra dentro da conversa, antes mesmo de abrir a boca.","Moral e venda andam juntos, e isso vale tanto pro indiv\xEDduo quanto pro time. Quando voc\xEA \xE9 validado pelo pr\xF3prio resultado \u2014 v\xEA o fruto do que fez \u2014 isso vira combust\xEDvel pra se superar no m\xEAs seguinte. E moral alta \xE9 contagiosa: pesquisas sobre emo\xE7\xE3o em grupo (cont\xE1gio emocional) mostram que o estado de \xE2nimo de uma pessoa se espalha pro time inteiro \u2014 um vendedor com moral elevada eleva a moral de quem trabalha ao lado dele, e o inverso tamb\xE9m \xE9 verdade."],practiceIntro:"Sua energia entra antes de voc\xEA abrir a boca \u2014 o cliente sente isso nos primeiros segundos, mesmo sem palavra nenhuma.",callouts:[{title:"Visualiza\xE7\xE3o pr\xE9via",text:"Visualize a venda com entusiasmo antes mesmo dela acontecer \u2014 isso ajusta sua postura e seu tom de voz sem voc\xEA perceber."},{title:"Ritual de energia",text:"Atletas de alto rendimento t\xEAm uma rotina fixa antes de competir (respira\xE7\xE3o, gesto, frase) pra entrar em estado de foco. Crie a sua: um gesto ou frase pessoal antes de cada atendimento pra \u201Cligar o interruptor\u201D."},{title:"Apar\xEAncia de vendedor empoderado",text:"Estar bem arrumado n\xE3o \xE9 sobre impressionar o cliente \u2014 \xE9 sobre como isso te faz sentir por dentro. Vendedor de elite cuida da pr\xF3pria imagem porque isso refor\xE7a a autoconfian\xE7a antes mesmo do primeiro contato."},{title:"Moral alta \xE9 contagiosa",text:"Comemore os pr\xF3prios resultados, por menores que sejam \u2014 isso n\xE3o \xE9 vaidade, \xE9 combust\xEDvel. E numa equipe, sua moral elevada puxa a moral de quem est\xE1 ao seu lado."}],exercise:{type:"reflect",prompt:"Pense no seu pr\xF3ximo atendimento de hoje (ou o de amanh\xE3, se j\xE1 encerrou o dia). Qual vai ser o seu ritual de energia antes dele \u2014 o gesto, a frase ou a pausa que voc\xEA vai usar pra chegar com energia de vendedor de elite, n\xE3o de atendente cansado?"}},{id:2,block:"Base",title:"Conex\xE3o em 30 Segundos",Icon:Uo,theory:["Estudos de forma\xE7\xE3o de primeira impress\xE3o mostram que as pessoas julgam confiabilidade e simpatia em poucos segundos de contato \u2014 e passam o resto da conversa confirmando essa impress\xE3o inicial, mesmo sem perceber. Por isso os primeiros 30 segundos pesam desproporcionalmente mais que o resto do atendimento.","Um dos princ\xEDpios de persuas\xE3o mais validados (Cialdini) \xE9 o da afinidade: confiamos mais e dizemos \u201Csim\u201D mais f\xE1cil pra quem parece parecido com a gente, ou por quem sentimos proximidade genu\xEDna.","Al\xE9m da afinidade de gosto, existe o rapport f\xEDsico: alinhar o ritmo de fala e o tom de voz com o do cliente \u2014 mais devagar com quem fala pausado, mais din\xE2mico com quem fala r\xE1pido \u2014 cria uma sensa\xE7\xE3o inconsciente de sintonia. N\xE3o precisa de r\xF3tulo de \u201Ct\xE9cnica secreta\u201D, \xE9 apenas aten\xE7\xE3o genu\xEDna ao outro."],practiceIntro:"Duas t\xE9cnicas simples aceleram essa conex\xE3o: repetir o nome do cliente (mais que o seu pr\xF3prio) e espelhar afinidades de gosto reais \u2014 nunca fatos de vida inventados.",exampleQuote:"\u201CAh seu Jo\xE3o, que fofo! Essa fase n\xE3o \xE9 f\xE1cil mesmo, n\xE9?\u201D \u2014 valida a fala do cliente sem precisar inventar nada sobre voc\xEA.",callouts:[{title:"Regra dos 2 minutos",text:"Voc\xEA tem cerca de 2 minutos de conversa pra arrancar um sorriso genu\xEDno do cliente \u2014 esse \xE9 o sinal real de que a conex\xE3o come\xE7ou."},{title:"Elogio espec\xEDfico > elogio gen\xE9rico",text:"\u201CQue blusa bonita\u201D qualquer um fala. \u201CAdorei como voc\xEA combinou esse tom com o casaco\u201D mostra aten\xE7\xE3o real \u2014 elogios espec\xEDficos geram muito mais conex\xE3o que gen\xE9ricos."}],exercise:{type:"quiz",prompt:"Qual resposta cria conex\xE3o de forma mais segura?",options:[{text:"\u201CNossa, que coincid\xEAncia, eu tamb\xE9m tenho uma filha dessa idade!\u201D (sem ter filha)",correct:!1,feedback:"Risco alto: \xE9 um fato de vida invent\xE1vel que pode te pegar numa pergunta de acompanhamento e quebrar a confian\xE7a que voc\xEA acabou de construir."},{text:"\u201CImagino! Nessa idade elas realmente aprontam bastante, n\xE9?\u201D",correct:!0,feedback:"Valida a experi\xEAncia do cliente sem afirmar nada espec\xEDfico sobre sua pr\xF3pria vida \u2014 mesmo efeito de conex\xE3o, sem risco."}]}},{id:3,block:"Base",title:"Escuta Ativa",Icon:Oo,theory:["\u201CSe voc\xEA n\xE3o perguntar, voc\xEA n\xE3o vai vender\u201D \u2014 a frase \xE9 do especialista Jeffrey Gitomer, mas resume um princ\xEDpio central de qualquer venda consultiva: quem faz as perguntas certas direciona a conversa, e quem escuta de verdade descobre o que o cliente n\xE3o diria se ningu\xE9m perguntasse.","Escuta ativa n\xE3o \xE9 s\xF3 ficar calado esperando a vez de falar \u2014 \xE9 resumir o que o cliente disse, confirmar que entendeu, e s\xF3 ent\xE3o responder. Isso faz o cliente sentir que foi realmente ouvido, n\xE3o s\xF3 atendido.","Uma t\xE9cnica simples chamada parafrasear consiste em repetir com suas palavras o que o cliente disse antes de responder (\u201CEnt\xE3o se eu entendi bem, o que mais pesa pra voc\xEA \xE9 o prazo, certo?\u201D) \u2014 isso confirma compreens\xE3o e evita que voc\xEA responda algo que o cliente nem perguntou."],practiceIntro:"Um bom vendedor n\xE3o tem medo de perguntar, e ouve tudo que o cliente tem a dizer \u2014 mesmo o que parece irrelevante \xE0 primeira vista.",callouts:[{title:"Sil\xEAncio estrat\xE9gico",text:"Depois que o cliente responde algo importante, resista \xE0 vontade de preencher o sil\xEAncio na hora \u2014 um segundo a mais de pausa costuma trazer um complemento mais sincero da resposta."}],exercise:{type:"reflect",prompt:"Na sua \xFAltima conversa de venda, lembra de algo que o cliente falou \u201Cde passagem\u201D que talvez escondesse uma necessidade real? O que voc\xEA faria diferente ouvindo com mais aten\xE7\xE3o?"}},{id:4,block:"Base",title:"Vendedor x Atendente",Icon:Go,theory:["A maioria dos treinamentos trata \u201Catender\u201D e \u201Cvender\u201D como sin\xF4nimos, mas s\xE3o pap\xE9is diferentes: o atendente responde ao que o cliente pede; o vendedor conduz o cliente at\xE9 a decis\xE3o. Um bom vendedor quase sempre \xE9 um bom atendente \u2014 mas o inverso nem sempre \xE9 verdade.","Um crit\xE9rio pr\xE1tico pra diferenciar os dois: quem pede permiss\xE3o o tempo todo (\u201Cposso te ajudar?\u201D, \u201Cposso te mostrar?\u201D) entrega o controle da conversa pro cliente a cada frase. Quem conduz, afirma e convida \u2014 sem parecer grosseiro.","Isso tamb\xE9m aparece no conceito de \u201Cdono do processo\u201D: o atendente segue o roteiro que o cliente prop\xF5e (ele pergunta, eu respondo, fim); o vendedor \xE9 quem decide os pr\xF3ximos passos da conversa, mesmo perguntando bastante \u2014 a diferen\xE7a n\xE3o est\xE1 em falar mais ou menos, est\xE1 em quem estrutura o caminho."],practiceIntro:"Isso n\xE3o \xE9 teoria abstrata \u2014 d\xE1 pra perceber no dia a dia observando quem pede permiss\xE3o e quem conduz.",callouts:[{title:"Frase-chave",text:"\u201CFoi um bom atendente, mas acima de tudo, foi um bom vendedor.\u201D"}],exercise:{type:"reflect",prompt:"Pensando no seu \xFAltimo atendimento: voc\xEA pediu permiss\xE3o pra conduzir os pr\xF3ximos passos, ou conduziu naturalmente? O que mudaria se voc\xEA tivesse afirmado em vez de perguntado?"}},{id:5,block:"Base",title:"Domine Qualquer Produto",Icon:_o,theory:["A t\xE9cnica de vendas \xE9 praticamente a mesma n\xE3o importa o produto \u2014 o que muda \xE9 a aplica\xE7\xE3o. Um vendedor treinado consegue vender um cart\xE3o de benef\xEDcios, um eletrodom\xE9stico ou uma consultoria, porque o processo (descobrir necessidade, apresentar valor, conduzir ao fechamento) \xE9 transfer\xEDvel.","A dificuldade real aparece quando o produto \xE9 novo ou \u201Cfrio\u201D pra voc\xEA \u2014 a\xED falta repert\xF3rio de obje\xE7\xF5es e de linguagem espec\xEDfica. Ferramentas de IA (como o ChatGPT) resolvem boa parte disso r\xE1pido: pe\xE7a um resumo dos principais benef\xEDcios, das obje\xE7\xF5es mais comuns, e at\xE9 simule uma conversa com um cliente c\xE9tico antes de ir pra rua.","Uma forma pr\xE1tica de acelerar esse dom\xEDnio \xE9 montar um mini-checklist antes de vender algo novo: (1) qual o benef\xEDcio central em uma frase, (2) pra quem esse produto n\xE3o serve, (3) as 3 obje\xE7\xF5es mais prov\xE1veis, (4) o que diferencia esse produto do concorrente mais pr\xF3ximo. Isso substitui meses de \u201Caprender na pr\xE1tica\u201D por um estudo de 30 minutos."],callouts:[{title:"Use a IA como treino",text:"Pe\xE7a pra uma IA simular um cliente c\xE9tico sobre esse produto e pratique responder antes de ir pra rua \u2014 \xE9 treino de gra\xE7a, sem risco de perder venda de verdade."}],exercise:{type:"reflect",prompt:"Escolha um produto que voc\xEA ainda n\xE3o domina bem. Pe\xE7a pra uma IA listar as 3 obje\xE7\xF5es mais prov\xE1veis sobre ele \u2014 e prepare uma resposta curta pra cada uma."}},{id:6,block:"Abordagem",title:"Abordagem Sem Medo",Icon:bo,theory:["Em vendas presenciais, boa parte da informa\xE7\xE3o que voc\xEA precisa j\xE1 est\xE1 dispon\xEDvel antes da primeira palavra: por onde o cliente passou, onde ele parou, o que ele olhou. Ler esses sinais de compra \xE9 pr\xE1tica cl\xE1ssica de varejo, e evita que a abordagem pare\xE7a um script decorado.","A abertura tamb\xE9m importa: a frase mais comum (\u201Ccomo posso te ajudar?\u201D) j\xE1 foi ouvida tantas vezes que o cliente nem registra mais. Substituir por algo que quebre esse piloto autom\xE1tico \u2014 como perguntar o nome logo de cara \u2014 muda a qualidade da conversa que vem depois.","Sinais de compra n\xE3o s\xE3o s\xF3 visuais \u2014 tamb\xE9m aparecem na fala. Um cliente que pergunta \u201Cquanto custa\u201D logo de cara sinaliza urg\xEAncia de decis\xE3o; um que pergunta \u201Ccomo funciona\u201D est\xE1 em fase de entendimento, ainda longe do fechamento. Ajustar o ritmo da abordagem a esse sinal evita empurrar demais ou devagar demais."],dialogue:[{from:"them",text:"Oi, tudo bem? Sou o Jean, t\xF4 aqui pra te ajudar. Qual seu nome?"},{from:"them",text:"\u201CMaria.\u201D"},{from:"me",text:"Dona Maria, perfeito. Percebi que a senhora parou na se\xE7\xE3o de guarda-roupa \u2014 seria pra senhora mesma?"}],exercise:{type:"quiz",prompt:"Qual abertura conduz melhor a venda?",options:[{text:"\u201CMeu nome \xE9 Ana, qualquer coisa me chama, fique \xE0 vontade.\u201D",correct:!1,feedback:"Entrega o controle pro cliente logo de cara \u2014 sem pergunta, sem dire\xE7\xE3o."},{text:"\u201COi, tudo bem? Sou o Jean, t\xF4 aqui pra te ajudar. Como posso te ajudar hoje?\u201D",correct:!1,feedback:"Educada, mas \xE9 a frase que o cliente j\xE1 ouviu tantas vezes que nem registra mais \u2014 piloto autom\xE1tico."},{text:"\u201COi, tudo bem? Sou a Ana, vou te ajudar. Qual seu nome?\u201D",correct:!0,feedback:"Quebra o script esperado pelo cliente e j\xE1 abre caminho pra usar o nome dele o resto da conversa."}]}},{id:7,block:"Abordagem",title:"Perguntas que Revelam",Icon:da,theory:["A metodologia SPIN Selling (Neil Rackham), uma das mais estudadas do mundo em vendas, resume o processo de perguntas em 4 camadas. A ideia central \xE9 que o cliente convence a si mesmo respondendo, mais do que sendo convencido pelo vendedor.","Entender por que um lead clicou num an\xFAncio espec\xEDfico j\xE1 revela boa parte da Situa\xE7\xE3o e do Problema \u2014 uma pergunta bem colocada no in\xEDcio economiza v\xE1rios minutos de tentativa e erro depois.","Perguntas abertas (\u201Ccomo\u201D, \u201Co que\u201D, \u201Cme conta\u201D) geram respostas ricas em informa\xE7\xE3o; perguntas fechadas (\u201Cvoc\xEA tem...\u201D, \u201Cvoc\xEA j\xE1...\u201D) servem pra confirmar um detalhe espec\xEDfico depois. Come\xE7ar aberto e fechar aos poucos \xE9 o funil cl\xE1ssico de qualquer boa entrevista de vendas.","Outro princ\xEDpio importante: nunca deixar o cliente \u201Cem aberto\u201D. Toda resposta sua \u2014 mesmo um simples \u201Csim\u201D ou \u201Cn\xE3o\u201D \u2014 deveria terminar com uma pergunta que mant\xE9m a conversa se movendo. Isso exige mente r\xE1pida: n\xE3o importa o que o cliente pergunte ou responda, o vendedor de elite j\xE1 emenda algo que avan\xE7a o processo, em vez de devolver o sil\xEAncio pra ele."],exampleQuote:"\u201CDona Maria, no nosso an\xFAncio, o que foi que te chamou aten\xE7\xE3o?\u201D \u2014 a resposta (ex: \u201Cvi que tem cardiologista\u201D) j\xE1 revela a necessidade real, sem parecer interrogat\xF3rio.",callouts:[{title:"SPIN em 4 perguntas",text:"Situa\xE7\xE3o: \u201Cme conta um pouco do seu dia a dia com isso\u201D. Problema: \u201Co que mais te incomoda hoje?\u201D. Implica\xE7\xE3o: \u201Ce isso te afeta como, no fim das contas?\u201D. Necessidade: \u201Cse isso fosse resolvido, o que mudaria pra voc\xEA?\u201D"},{title:"Nunca deixe em aberto",text:"Cliente pergunta \u201Cposso pagar no Pix?\u201D e a resposta \xE9 n\xE3o. Em vez de s\xF3 \u201Cn\xE3o, infelizmente\u201D, feche com uma pergunta que j\xE1 avan\xE7a: \u201Cn\xE3o aceita Pix pra mensalidade, mas qual banco voc\xEA usa pra eu te ajudar a cadastrar o cart\xE3o?\u201D. A resposta virou combust\xEDvel pro pr\xF3ximo passo, n\xE3o um ponto final."}],exercise:{type:"reflect",prompt:"Pensando numa venda recente: qual pergunta simples poderia ter revelado a necessidade real do cliente mais cedo?"}},{id:8,block:"Abordagem",title:"Leia o Perfil do Cliente",Icon:Ut,theory:["Clientes diferentes processam e decidem de formas diferentes. Um modelo simples usado h\xE1 d\xE9cadas em treinamentos de vendas separa em 4 perfis: o Anal\xEDtico, o Decidido, o Expressivo e o Af\xE1vel.","Esse modelo se baseia em dois eixos: quanto a pessoa \xE9 mais assertiva (fala primeiro, decide r\xE1pido) ou mais receptiva (ouve mais, decide com calma), e quanto ela \xE9 mais orientada a tarefa (dados, l\xF3gica) ou a pessoas (rela\xE7\xE3o, sentimento). Cruzando os dois eixos, voc\xEA chega nos 4 perfis.","N\xE3o existe perfil certo ou errado \u2014 existe adapta\xE7\xE3o. O mesmo produto pode ser apresentado com dados e comparativos pro Anal\xEDtico, e com uma hist\xF3ria real e vis\xE3o de futuro pro Expressivo."],callouts:[{title:"Dica r\xE1pida por perfil",text:"Anal\xEDtico: leve n\xFAmeros e comparativos. Decidido: seja direto, n\xE3o enrole. Expressivo: conte uma hist\xF3ria, mostre entusiasmo. Af\xE1vel: v\xE1 com calma, construa confian\xE7a antes de vender."}],exercise:{type:"reflect",prompt:"Pense num cliente que voc\xEA atendeu recentemente. Qual desses 4 perfis parece mais com ele? O que voc\xEA apresentaria diferente sabendo disso?"}},{id:9,block:"Apresenta\xE7\xE3o",title:"Benef\xEDcio > Caracter\xEDstica",Icon:bt,theory:["Uma das ideias mais citadas em marketing (do professor de Harvard Theodore Levitt) \xE9: \u201Cas pessoas n\xE3o compram uma broca de um quarto de polegada, compram um furo de um quarto de polegada\u201D. Ningu\xE9m compra a caracter\xEDstica t\xE9cnica \u2014 compra o resultado que ela entrega.","Apresentar 3 op\xE7\xF5es (mais cara, intermedi\xE1ria, mais barata) \xE9 uma t\xE9cnica validada de precifica\xE7\xE3o chamada ancoragem: a op\xE7\xE3o mais cara recalibra a percep\xE7\xE3o de pre\xE7o, fazendo a intermedi\xE1ria parecer o equil\xEDbrio ideal \u2014 geralmente onde a venda acontece.","Tangibilizar o benef\xEDcio com n\xFAmero ou compara\xE7\xE3o concreta (economiza X por m\xEAs, resolve em Y dias) refor\xE7a a percep\xE7\xE3o de valor muito mais do que um adjetivo gen\xE9rico como \u201C\xF3timo\u201D ou \u201Cexcelente\u201D."],exampleQuote:"\u201CSua filha merece o melhor\u201D \u2014 venda por procura\xE7\xE3o emocional, criando uma vis\xE3o de futuro antes mesmo do fechamento.",callouts:[{title:"Estrutura Caracter\xEDstica \u2192 Vantagem \u2192 Benef\xEDcio",text:"Caracter\xEDstica: \u201Cesse plano tem consulta com cardiologista\u201D. Vantagem: \u201Cou seja, sua fam\xEDlia tem acesso r\xE1pido a especialista\u201D. Benef\xEDcio: \u201Cent\xE3o voc\xEAs n\xE3o ficam meses numa fila de espera se algo acontecer\u201D. Termine sempre no benef\xEDcio."}],exercise:{type:"reflect",prompt:"Pegue um produto que voc\xEA vende e escreva 1 frase de caracter\xEDstica t\xE9cnica \u2014 depois reescreva como benef\xEDcio real pro cliente."}},{id:10,block:"Apresenta\xE7\xE3o",title:"Storytelling",Icon:Eo,theory:["Hist\xF3rias reais convencem mais que argumentos t\xE9cnicos porque baixam a guarda racional de quem ouve \u2014 em vez de avaliar um argumento, a pessoa se imagina vivendo aquela hist\xF3ria. \xC9 por isso que depoimentos de outros clientes costumam pesar mais que qualquer lista de benef\xEDcios.","Uma estrutura simples de hist\xF3ria de venda: Antes (qual era o problema do cliente), Durante (o que ele tentou ou sentiu) e Depois (o resultado real depois de resolver) \u2014 tr\xEAs frases j\xE1 bastam.","Usar as palavras que o pr\xF3prio cliente j\xE1 falou dentro da hist\xF3ria aumenta a identifica\xE7\xE3o \u2014 se um cliente anterior disse \u201Ceu tava com medo de n\xE3o caber no bolso\u201D, repetir essa frase quase literal pro pr\xF3ximo cliente com o mesmo receio cria reconhecimento imediato."],callouts:[{title:"Combine com prova social",text:"Sempre que poss\xEDvel, complemente a hist\xF3ria com algo verific\xE1vel (uma avalia\xE7\xE3o, um print, um n\xFAmero) \u2014 hist\xF3ria sozinha convence, hist\xF3ria com prova social convence e comprova."}],exercise:{type:"reflect",prompt:"Pense num cliente satisfeito que voc\xEA atendeu. Escreva em 3 frases curtas: qual era o problema dele, o que ele sentiu, e como ficou depois. Guarde essa hist\xF3ria pra usar na pr\xF3xima venda parecida."}},{id:11,block:"Apresenta\xE7\xE3o",title:"Gatilhos Mentais",Icon:Nt,theory:["O psic\xF3logo Robert Cialdini identificou 6 princ\xEDpios de persuas\xE3o validados por pesquisa. N\xE3o s\xE3o truque \u2014 s\xE3o atalhos mentais reais que todo mundo usa pra decidir mais r\xE1pido.","O cuidado principal \xE9 us\xE1-los com verdade: escassez genu\xEDna, urg\xEAncia real, prova social real. Gatilho fabricado, quando descoberto, destr\xF3i a confian\xE7a que voc\xEA passou a venda inteira construindo.","Cialdini atualizou sua lista original com um s\xE9timo princ\xEDpio, chamado unidade: as pessoas confiam mais em quem elas sentem que faz parte do \u201Cmesmo grupo\u201D que elas (mesma cidade, mesma profiss\xE3o, mesma causa) \u2014 \xE0s vezes mais forte ainda que simples afinidade de gosto."],exampleQuote:"Senso de urg\xEAncia real: \u201Ccora\xE7\xE3o n\xE3o \xE9 brincadeira\u201D, quando a necessidade de sa\xFAde \xE9 genu\xEDna \u2014 n\xE3o press\xE3o artificial.",callouts:[{title:"Os 6 princ\xEDpios de Cialdini, resumidos",text:"Reciprocidade (dar algo antes de pedir), Compromisso e coer\xEAncia (pequenos sins levam a sins maiores), Prova social (o que os outros fazem), Afinidade (gostar de quem se parece com voc\xEA), Autoridade (confiar em quem domina o assunto), Escassez (valorizar o que \xE9 limitado)."}],exercise:{type:"reflect",prompt:"Qual desses princ\xEDpios voc\xEA j\xE1 usa sem saber o nome? Qual voc\xEA quase nunca usa e poderia testar essa semana?"}},{id:12,block:"Obje\xE7\xF5es",title:"As 5 Obje\xE7\xF5es Mais Comuns",Icon:Bt,theory:["A maioria das obje\xE7\xF5es se encaixa em 5 categorias: pre\xE7o (\u201Ct\xE1 caro\u201D), tempo (\u201Cvou pensar\u201D), confian\xE7a (\u201Cpreciso ver com meu marido/s\xF3cio\u201D), necessidade (\u201Cn\xE3o sei se preciso disso\u201D) e timing (\u201Cagora n\xE3o \xE9 hora\u201D). Identificar a categoria muda completamente a resposta certa.","Estrutura simples pra qualquer obje\xE7\xE3o: reconhecer o que o cliente disse sem discordar de cara, fazer uma pergunta que esclare\xE7a a real raz\xE3o, e s\xF3 ent\xE3o responder \u2014 em vez de uma resposta pronta gen\xE9rica.","Antes de responder qualquer obje\xE7\xE3o, vale confirmar se ela \xE9 a \xFAnica barreira: \u201Cal\xE9m do pre\xE7o, tem mais alguma coisa te deixando em d\xFAvida?\u201D \u2014 isso evita gastar energia resolvendo uma obje\xE7\xE3o e descobrir depois que existia outra maior escondida."],callouts:[{title:"T\xE9cnica Sentir-Sentiram-Descobriram",text:"\u201CEntendo que voc\xEA sinta isso. Outros clientes tamb\xE9m sentiram o mesmo no in\xEDcio. Mas descobriram que, depois de experimentar, valia a pena.\u201D \u2014 forma cl\xE1ssica de reconhecer a obje\xE7\xE3o sem confrontar o cliente."}],exercise:{type:"reflect",prompt:"Qual dessas 5 obje\xE7\xF5es voc\xEA mais escuta no seu dia a dia? Escreva a pergunta de esclarecimento que voc\xEA faria antes de responder."}},{id:13,block:"Obje\xE7\xF5es",title:"\u201CT\xE1 Caro\u201D: Scripts Prontos",Icon:Wo,theory:["Obje\xE7\xE3o de pre\xE7o que aparece antes do cliente sentir o valor real do produto \xE9 sempre mais dif\xEDcil de reverter do que a que aparece depois. Por isso, adiar a conversa de pre\xE7o at\xE9 depois da experi\xEAncia (provar, testar, visualizar) costuma funcionar melhor do que responder de cara.","Quando o pre\xE7o vem \xE0 tona, refor\xE7ar valor e op\xE7\xF5es de forma de pagamento tende a suavizar mais que simplesmente justificar o n\xFAmero.","Tamb\xE9m vale isolar a obje\xE7\xE3o antes de responder: perguntar \u201C\xE9 s\xF3 o valor que te preocupa, ou tem mais alguma coisa?\u201D evita tratar sintoma (pre\xE7o) quando o problema real pode ser outro (confian\xE7a, tempo, necessidade)."],exampleQuote:"\u201CProva primeiro, depois a gente v\xEA esse neg\xF3cio de pre\xE7o.\u201D",callouts:[{title:"Compare o custo no dia a dia",text:"Transformar o valor total em custo di\xE1rio ou mensal (\u201Csai menos que um lanche por dia\u201D) muda a percep\xE7\xE3o de peso do pre\xE7o, sem mudar o valor real."}],exercise:{type:"reflect",prompt:"Da pr\xF3xima vez que ouvir \u201Ct\xE1 caro\u201D antes da hora, experimente adiar pra depois da experi\xEAncia. Anote o que mudou na rea\xE7\xE3o do cliente."}},{id:14,block:"Obje\xE7\xF5es",title:"Simulador de Obje\xE7\xE3o",Icon:Vo,theory:["Praticar obje\xE7\xF5es num ambiente seguro, antes de enfrentar o cliente real, \xE9 uma das formas mais eficazes de melhorar r\xE1pido em qualquer habilidade complexa \u2014 o princ\xEDpio da pr\xE1tica deliberada, estudado pelo psic\xF3logo Anders Ericsson. Errar aqui n\xE3o custa uma venda de verdade.","Diferentes clientes fazem a mesma obje\xE7\xE3o por motivos diferentes \u2014 o c\xE9tico quer prova concreta, o apressado quer resposta r\xE1pida sem rodeio, o indeciso quer sentir seguran\xE7a antes de decidir. Reconhecer qual tipo est\xE1 na sua frente muda o tom da resposta, mesmo que o conte\xFAdo seja parecido."],callouts:[{title:"3 perfis de obje\xE7\xE3o",text:"Cliente c\xE9tico (quer prova), cliente apressado (quer objetividade), cliente indeciso (quer seguran\xE7a) \u2014 cada um precisa de uma resposta com tom diferente pra mesma obje\xE7\xE3o."}],exercise:{type:"roleplay",intro:"Cliente diz: \u201CVou pensar e te dou um retorno.\u201D",steps:{start:{options:[{text:"\u201CTudo bem, sem problema! Qualquer coisa voc\xEA me chama.\u201D",feedback:"Aceita a obje\xE7\xE3o sem investigar \u2014 a conversa esfria a partir daqui.",next:"cold"},{text:"\u201CEntendo! S\xF3 pra eu te ajudar melhor: o que especificamente te deixou em d\xFAvida \u2014 o valor, o prazo, ou se \xE9 o produto certo pra voc\xEA?\u201D",feedback:"Reconhece a obje\xE7\xE3o sem discordar, e j\xE1 investiga a real raz\xE3o por tr\xE1s dela.",next:"warm"}]},cold:{client:"\u201CAh, ent\xE3o t\xE1 bom... obrigada.\u201D (some da conversa)",outcomeTitle:"Venda esfriou",outcomeText:"Sem uma pergunta que investigasse o motivo real, a obje\xE7\xE3o gen\xE9rica \u201Cvou pensar\u201D virou um adeus educado. Isso refor\xE7a por que aceitar a obje\xE7\xE3o sem investigar quase sempre esfria a venda."},warm:{client:"\u201C\xC9 mais o valor mesmo, achei salgado.\u201D",options:[{text:"\u201CEntendi. Al\xE9m do valor, tem mais alguma coisa te deixando em d\xFAvida?\u201D",next:"encaminhada"},{text:"\u201CMas veja, \xE9 um excelente investimento, vale muito a pena!\u201D",next:"parcial"}]},encaminhada:{client:"\u201CAh, \xE9 s\xF3 o valor mesmo. Se puder ver alguma condi\xE7\xE3o, eu fecho.\u201D",outcomeTitle:"Venda encaminhada",outcomeText:"Isolar a obje\xE7\xE3o antes de responder (confirmar se \xE9 s\xF3 o pre\xE7o) aumenta bastante a chance de reverter \u2014 \xE9 a t\xE9cnica que vimos na Li\xE7\xE3o 12."},parcial:{client:"\u201CT\xE1 bom... vou pensar melhor ent\xE3o.\u201D",outcomeTitle:"Venda parcialmente esfriada",outcomeText:"Pular a etapa de isolar a obje\xE7\xE3o e j\xE1 defender o pre\xE7o direto pode soar defensivo \u2014 funciona \xE0s vezes, mas perde a chance de descobrir se existia uma d\xFAvida maior escondida."}}}},{id:15,block:"Fechamento",title:"Fechamento de Elite",Icon:Za,theory:["O fechamento assumptivo \xE9 uma das t\xE9cnicas mais ensinadas em treinamentos de alta performance: em vez de perguntar se o cliente quer fechar (abrindo espa\xE7o pro \u201Cn\xE3o\u201D), o vendedor conduz como se a decis\xE3o j\xE1 estivesse tomada, e s\xF3 resta decidir um detalhe (cor, prazo, forma de pagamento).","Exce\xE7\xE3o importante: pedir permiss\xE3o (\u201Cposso\u201D) continua correto e necess\xE1rio quando envolve dados pessoais ou documentos do cliente \u2014 a\xED n\xE3o \xE9 sobre condu\xE7\xE3o de venda, \xE9 sobre respeito.","Fechamentos n\xE3o precisam esperar o final da conversa \u2014 mini-fechamentos ao longo do atendimento (\u201Cisso faz sentido at\xE9 aqui?\u201D, \u201Cessa op\xE7\xE3o parece mais com o que voc\xEA procura?\u201D) v\xE3o testando a temperatura da venda e evitam a surpresa de um \u201Cn\xE3o\u201D grande no final."],exampleQuote:"\u201CFicou com alguma d\xFAvida ou posso te mandar o link de cadastro?\u201D \u2014 o \u201Cposso\u201D aparece, mas s\xF3 oferece caminhos que avan\xE7am a venda.",callouts:[{title:"Modelo \u201CFaz sentido pra voc\xEA?\u201D",text:"Explica\xE7\xE3o clara do produto + limites transparentes + \u201Cisso faz sentido pra voc\xEA?\u201D \u2014 t\xE9cnica do Sistema Sandler de Vendas, gera um mini-compromisso de coer\xEAncia antes do fechamento."},{title:"Mais t\xE9cnicas de fechamento",text:"Fechamento por resumo: recapitular os benef\xEDcios que o cliente confirmou. Fechamento por escassez: mencionar prazo ou disponibilidade real. Fechamento por alternativa: oferecer duas op\xE7\xF5es que j\xE1 pressup\xF5em o \u201Csim\u201D."}],exercise:{type:"reflect",prompt:"Pegue uma frase de fechamento que voc\xEA usa e reescreva no formato: explica\xE7\xE3o clara + limite transparente + \u201Cfaz sentido pra voc\xEA?\u201D"}},{id:16,block:"Fechamento",title:"P\xF3s-Venda que Vende Sozinho",Icon:fa,theory:["Conquistar um cliente novo custa, em m\xE9dia, muito mais caro do que manter ou ativar um cliente satisfeito \u2014 por isso pedir indica\xE7\xE3o e avalia\xE7\xE3o n\xE3o \xE9 um favor extra, \xE9 uma das formas mais baratas de gerar novas vendas que existem.","Uma avalia\xE7\xE3o real no Google vira prova social direta pra clientes inseguros no futuro \u2014 muito mais convincente do que qualquer argumento do pr\xF3prio vendedor.","O psic\xF3logo Daniel Kahneman descreveu a \u201Cregra do pico-fim\u201D: as pessoas julgam uma experi\xEAncia principalmente pelo momento mais intenso e por como ela termina \u2014 n\xE3o pela m\xE9dia de tudo que aconteceu. Por isso pedir indica\xE7\xE3o logo depois do momento de satisfa\xE7\xE3o captura o cliente no ponto mais favor\xE1vel poss\xEDvel."],callouts:[{title:"Cad\xEAncia de acompanhamento",text:"Um contato de p\xF3s-venda r\xE1pido alguns dias depois (perguntando se est\xE1 tudo certo) refor\xE7a a percep\xE7\xE3o de cuidado \u2014 e \xE9 o momento natural de pedir a indica\xE7\xE3o, quando o cliente j\xE1 sentiu o valor na pr\xE1tica."}],exercise:{type:"reflect",prompt:"Depois da sua pr\xF3xima venda, pe\xE7a indica\xE7\xE3o e avalia\xE7\xE3o no mesmo momento (n\xE3o depois). Anote se o cliente respondeu diferente por voc\xEA pedir na hora."}}],Un=[{id:"b2b",label:"B2B",Icon:Rt},{id:"online",label:"Online",Icon:Et},{id:"promoter",label:"Promoter",Icon:zt},{id:"varejo",label:"Varejo",Icon:Ot},{id:"telemarketing",label:"Liga\xE7\xE3o",Icon:Tt},{id:"perguntas",label:"Perguntas",Icon:da},{id:"objecoes",label:"Quebra Obje\xE7\xE3o",Icon:Bt}],Ht=[{id:"b2b-1",model:"b2b",title:"Prospec\xE7\xE3o fria sem resposta",situation:"Voc\xEA mandou uma mensagem de prospec\xE7\xE3o por LinkedIn pra uma gestora de RH h\xE1 2 semanas. Ela visualizou, mas n\xE3o respondeu. O que fazer?",options:[{text:"Mandar a mesma mensagem de novo, s\xF3 pra lembrar",correct:!1,feedback:"Repetir a mensagem igual passa desespero e n\xE3o d\xE1 motivo novo pra responder."},{text:"Mandar uma mensagem curta com um motivo novo e espec\xEDfico (ex: um resultado que uma empresa parecida teve), sem cobrar resposta",correct:!0,feedback:"Reabre a conversa com valor novo, sem soar como cobran\xE7a \u2014 reduz a barreira de responder."},{text:"Desistir e partir pro pr\xF3ximo lead",correct:!1,feedback:"Ciclo de decis\xE3o B2B \xE9 mais longo \u2014 follow-up estruturado \xE9 normal, n\xE3o sinal de fracasso."}]},{id:"b2b-2",model:"b2b",title:"M\xFAltiplos decisores na mesma reuni\xE3o",situation:"Numa reuni\xE3o de apresenta\xE7\xE3o, tem duas pessoas decidindo junto: a gestora de RH (quer benef\xEDcio pros funcion\xE1rios) e o financeiro (s\xF3 quer saber o custo). Como conduzir?",options:[{text:"Focar s\xF3 no financeiro, j\xE1 que ele \u201Csegura o or\xE7amento\u201D",correct:!1,feedback:"Ignorar a RH perde a patrocinadora interna que defende a compra depois que voc\xEA sair da sala."},{text:"Apresentar o benef\xEDcio pra RH e traduzir isso em custo-benef\xEDcio pro financeiro, na mesma reuni\xE3o",correct:!0,feedback:"Cada decisor tem um crit\xE9rio diferente \u2014 atender aos dois evita que um vete a decis\xE3o do outro depois."},{text:"Ignorar os dois ali e s\xF3 mandar proposta por e-mail depois",correct:!1,feedback:"Perde a chance de j\xE1 testar obje\xE7\xF5es e ajustar o discurso ao vivo."}]},{id:"b2b-3",model:"b2b",title:"Compara\xE7\xE3o com concorrente mais barato",situation:"O comprador diz: \u201Ca proposta da concorrente X est\xE1 20% mais barata, voc\xEAs conseguem chegar nesse valor?\u201D O que fazer?",options:[{text:"Ceder o desconto na hora pra n\xE3o perder a venda",correct:!1,feedback:"Desconto imediato ensina o cliente a sempre pedir mais, e desvaloriza a proposta."},{text:"Perguntar o que exatamente est\xE1 incluso na proposta da concorrente antes de falar de pre\xE7o",correct:!0,feedback:"A compara\xE7\xE3o raramente \xE9 1:1 (menos suporte, menos garantia) \u2014 isolar isso muda a conversa de pre\xE7o pra valor."},{text:"Recusar de forma seca, dizendo que o pre\xE7o \xE9 fechado",correct:!1,feedback:"Fecha a porta sem entender o motivo real por tr\xE1s da compara\xE7\xE3o."}]},{id:"online-1",model:"online",title:"Lead frio do WhatsApp n\xE3o responde",situation:"Um lead chega no seu WhatsApp ap\xF3s clicar num an\xFAncio. Voc\xEA manda \u201COi, bom dia! Como posso te ajudar?\u201D e ele n\xE3o responde. O que fazer diferente?",options:[{text:"Mandar uma segunda mensagem igual, tipo \u201Coi, tudo bem?\u201D",correct:!1,feedback:"Mensagem gen\xE9rica repetida n\xE3o d\xE1 motivo novo pra resposta."},{text:"Na primeira mensagem, j\xE1 referenciar o an\xFAncio espec\xEDfico que ele clicou e fazer uma pergunta direta",correct:!0,feedback:"Reduz a fric\xE7\xE3o e aumenta a taxa de resposta \u2014 mostra contexto e j\xE1 avan\xE7a a conversa (like a Situa\xE7\xE3o do SPIN)."},{text:"Ligar direto, sem mandar mensagem antes",correct:!1,feedback:"Pode assustar um lead que ainda n\xE3o teve nenhum contato pr\xE9vio de texto."}]},{id:"online-2",model:"online",title:"\u201CMe manda mais informa\xE7\xF5es\u201D e some",situation:"Voc\xEA mandou o material pro cliente e ele n\xE3o responde mais. O que fazer?",options:[{text:"Esperar ele voltar sozinho",correct:!1,feedback:"A maioria dos leads que somem precisa de um empurr\xE3o \u2014 raramente volta sozinho."},{text:"Mandar follow-up com pergunta espec\xEDfica sobre o material (ex: \u201Cficou d\xFAvida sobre o valor ou sobre como funciona?\u201D)",correct:!0,feedback:"Pergunta espec\xEDfica facilita resposta, porque d\xE1 um caminho claro pra continuar a conversa."},{text:"Insistir todo dia at\xE9 ele responder",correct:!1,feedback:"Excesso de insist\xEAncia gera desconforto e pode fazer o lead bloquear o contato."}]},{id:"online-3",model:"online",title:"Hesita\xE7\xE3o no link de pagamento",situation:"Voc\xEA j\xE1 explicou tudo, o cliente disse \u201Cfaz sentido\u201D, mas na hora do link de pagamento ele hesita e n\xE3o clica. O que fazer?",options:[{text:"Mandar o link de novo sem dizer mais nada",correct:!1,feedback:"N\xE3o trata a hesita\xE7\xE3o, s\xF3 repete a a\xE7\xE3o que j\xE1 travou."},{text:"Perguntar diretamente se ficou alguma d\xFAvida ou se \xE9 sobre a forma de pagamento, antes de insistir no link",correct:!0,feedback:"Isola a real raz\xE3o da hesita\xE7\xE3o antes de insistir na a\xE7\xE3o."},{text:"Oferecer desconto na hora pra for\xE7ar a decis\xE3o",correct:!1,feedback:"Pode passar impress\xE3o de desespero e desvalorizar o produto sem nem saber qual \xE9 o problema real."}]},{id:"promoter-1",model:"promoter",title:"Pessoa passa r\xE1pido sem olhar",situation:"Voc\xEA est\xE1 num estande de feira e uma pessoa passa r\xE1pido pelo corredor, sem olhar pro seu lado. O que fazer?",options:[{text:"Gritar \u201Cvem c\xE1, olha isso aqui!\u201D",correct:!1,feedback:"Aborda de forma invasiva e aumenta a resist\xEAncia natural da pessoa."},{text:"Fazer uma pergunta curta e espec\xEDfica, em tom de conversa (\u201Cj\xE1 viu o desconto pra quem mora aqui perto?\u201D)",correct:!0,feedback:"Desperta curiosidade espec\xEDfica sem ser invasivo \u2014 aumenta a chance de pausa."},{text:"Deixar passar e esperar a pr\xF3xima pessoa",correct:!1,feedback:"Em ambiente de fluxo, a abordagem ativa \xE9 o que gera volume \u2014 deixar passar reduz a convers\xE3o."}]},{id:"promoter-2",model:"promoter",title:"Duas pessoas juntas, quem abordar",situation:"Duas amigas passam juntas olhando o estande. Quem voc\xEA aborda primeiro?",options:[{text:"A que est\xE1 mais na frente, s\xF3 porque chegou primeiro",correct:!1,feedback:"Nem sempre quem est\xE1 na frente \xE9 quem decide ou demonstra mais interesse."},{text:"Observar quem demonstra mais interesse e direcionar a abordagem a ela, incluindo a amiga na conversa",correct:!0,feedback:"Aborda quem sinaliza interesse real, mas mant\xE9m a outra envolvida como valida\xE7\xE3o social."},{text:"Ignorar as duas at\xE9 que uma pare sozinha",correct:!1,feedback:"Perde a oportunidade de abordagem ativa, que \xE9 a base do trabalho de promoter."}]},{id:"promoter-3",model:"promoter",title:"\u201CS\xF3 t\xF4 olhando\u201D e seguiu andando",situation:"Voc\xEA j\xE1 abordou, a pessoa disse \u201Cs\xF3 t\xF4 olhando\u201D e continuou andando. O que fazer?",options:[{text:"Deixar ir e n\xE3o falar mais nada",correct:!1,feedback:"Perde a chance de reverter uma obje\xE7\xE3o autom\xE1tica, que geralmente \xE9 s\xF3 reflexo, n\xE3o recusa real."},{text:"Fazer uma \xFAltima pergunta leve, sem press\xE3o (\u201Csem compromisso, voc\xEA j\xE1 conhece esse tipo de produto?\u201D)",correct:!0,feedback:"Reduz a resist\xEAncia autom\xE1tica e reabre espa\xE7o pra conversa sem parecer insistente."},{text:"Segui-la insistindo no mesmo discurso",correct:!1,feedback:"Aumenta o desconforto e refor\xE7a a decis\xE3o de recusa."}]},{id:"varejo-1",model:"varejo",title:"Cliente comparando pre\xE7o no celular",situation:"O cliente est\xE1 na loja olhando o produto, mas com o celular na m\xE3o comparando pre\xE7o em outro site. O que fazer?",options:[{text:"Ignorar e deixar ele decidir sozinho",correct:!1,feedback:"Perde a chance de agregar valor que o site concorrente n\xE3o oferece."},{text:"Perguntar o que ele est\xE1 encontrando, e destacar o que a compra na loja oferece que o site n\xE3o oferece",correct:!0,feedback:"Em vez de competir s\xF3 em pre\xE7o, desloca a compara\xE7\xE3o pro que \xE9 exclusivo da experi\xEAncia presencial."},{text:"Criticar o site concorrente",correct:!1,feedback:"Passa inseguran\xE7a e n\xE3o agrega valor real \xE0 sua oferta."}]},{id:"varejo-2",model:"varejo",title:"Casal decidindo junto",situation:"A esposa demonstra todo o interesse e decide os detalhes, mas \xE9 o marido quem vai pagar e ele parece impaciente. Pra quem voc\xEA conduz a conversa?",options:[{text:"S\xF3 pro marido, porque \xE9 quem paga",correct:!1,feedback:"Ignora quem realmente est\xE1 decidindo o produto, o que pode esfriar a venda."},{text:"Pros dois \u2014 aprofunda com a esposa nos detalhes do produto, mas inclui o marido em prazo e forma de pagamento",correct:!0,feedback:"Atende os dois crit\xE9rios de decis\xE3o na mesma conversa, sem excluir nenhum dos dois."},{text:"Focar s\xF3 na esposa e ignorar a impaci\xEAncia do marido",correct:!1,feedback:"Se o marido ficar desconfort\xE1vel, pode apressar a esposa a desistir s\xF3 pra sair logo."}]},{id:"varejo-3",model:"varejo",title:"Reclama\xE7\xE3o vira oportunidade",situation:"Um cliente vem devolver um produto reclamando que n\xE3o funcionou como esperava. O que fazer al\xE9m de resolver a devolu\xE7\xE3o?",options:[{text:"S\xF3 processar a devolu\xE7\xE3o e n\xE3o falar mais nada",correct:!1,feedback:"Perde a chance de reverter a experi\xEAncia ruim numa nova venda ou numa recomenda\xE7\xE3o melhor."},{text:"Resolver a devolu\xE7\xE3o com aten\xE7\xE3o genu\xEDna, e entender o que ele realmente precisava pra sugerir algo mais adequado",correct:!0,feedback:"Atendimento bem feito numa reclama\xE7\xE3o costuma gerar mais fideliza\xE7\xE3o do que uma venda tranquila."},{text:"Tentar vender outro produto na mesma hora, antes de resolver a reclama\xE7\xE3o",correct:!1,feedback:"Parece oportunismo antes de resolver o problema, o que aumenta a insatisfa\xE7\xE3o."}]},{id:"tele-1",model:"telemarketing",title:"Caixa postal",situation:"Voc\xEA liga pro lead e cai direto na caixa postal. O que fazer?",options:[{text:"Desligar sem deixar mensagem",correct:!1,feedback:"Perde a chance de gerar curiosidade mesmo sem contato direto."},{text:"Deixar mensagem curta com nome, motivo espec\xEDfico da liga\xE7\xE3o, e avisar que vai mandar mensagem de texto em seguida",correct:!0,feedback:"Gera contexto e abre um segundo canal (texto) pra aumentar a chance de resposta."},{text:"Ligar de novo imediatamente, v\xE1rias vezes seguidas",correct:!1,feedback:"Pode ser percebido como insist\xEAncia excessiva e gerar bloqueio."}]},{id:"tele-2",model:"telemarketing",title:"\u201CN\xE3o tenho tempo agora\u201D",situation:"A pessoa atende, mas diz logo de cara: \u201Cn\xE3o tenho tempo agora\u201D. O que fazer?",options:[{text:"Insistir e continuar falando mesmo assim",correct:!1,feedback:"Ignora o que a pessoa acabou de pedir, gerando m\xE1 impress\xE3o imediata."},{text:"Respeitar o tempo dela, perguntar o melhor hor\xE1rio pra retornar, e confirmar esse hor\xE1rio",correct:!0,feedback:"Mostra respeito pelo tempo do cliente e garante um novo ponto de contato agendado, n\xE3o em aberto."},{text:"Desligar sem tentar remarcar",correct:!1,feedback:"Perde a oportunidade de um contato futuro estruturado."}]},{id:"tele-3",model:"telemarketing",title:"\u201CMe liga semana que vem\u201D",situation:"A pessoa pede pra voc\xEA ligar de novo \u201Csemana que vem\u201D. O que fazer?",options:[{text:"Anotar mentalmente e tentar lembrar",correct:!1,feedback:"Sem registro estruturado, a maioria desses contatos nunca acontece de fato."},{text:"Confirmar dia e hor\xE1rio espec\xEDficos antes de desligar, e agendar isso no seu sistema",correct:!0,feedback:"Transforma uma resposta vaga em um compromisso concreto, aumentando a chance real do follow-up."},{text:"Ligar antes do prazo combinado pra \u201Cgarantir\u201D",correct:!1,feedback:"Quebra a expectativa combinada e pode passar impress\xE3o de descontrole/ansiedade."}]},{id:"pergunta-1",model:"perguntas",title:"Cliente pergunta se pode pagar no Pix",situation:"Cliente pergunta: \u201Cposso pagar no Pix?\u201D Mas o sistema s\xF3 aceita cart\xE3o de d\xE9bito pra mensalidade. O que voc\xEA responde?",options:[{text:"\u201CN\xE3o, s\xF3 aceita cart\xE3o de d\xE9bito.\u201D",correct:!1,feedback:"Resposta seca \u2014 fecha a conversa sem abrir um novo caminho pra continuar."},{text:"\u201CComo \xE9 mensalidade, o sistema n\xE3o aceita Pix, infelizmente. Qual banco voc\xEA usa pra eu j\xE1 te ajudar a cadastrar o cart\xE3o?\u201D",correct:!0,feedback:"Explica o motivo e j\xE1 emenda uma pergunta que avan\xE7a o cadastro \u2014 nunca deixa o cliente em aberto."},{text:"\u201CDeixa eu verificar e te retorno.\u201D",correct:!1,feedback:"Adia sem necessidade uma resposta que voc\xEA j\xE1 sabia \u2014 perde o timing da conversa."}]},{id:"pergunta-2",model:"perguntas",title:"Cliente pergunta sobre desconto \xE0 vista",situation:"Cliente pergunta: \u201Ctem desconto pra quem paga \xE0 vista?\u201D O que fazer?",options:[{text:"\u201CN\xE3o, n\xE3o trabalhamos com desconto.\u201D",correct:!1,feedback:"Fecha a porta sem entender o motivo real por tr\xE1s da pergunta."},{text:"\u201CHoje n\xE3o trabalhamos com desconto \xE0 vista, mas me conta: seria s\xF3 pra voc\xEA ou pra mais algu\xE9m da fam\xEDlia tamb\xE9m?\u201D",correct:!0,feedback:"Responde com honestidade e j\xE1 usa a deixa pra investigar uma necessidade maior (poss\xEDvel upsell)."},{text:"\u201CVou perguntar pro meu gerente.\u201D",correct:!1,feedback:"Adia desnecessariamente uma resposta que voc\xEA j\xE1 sabia de cara."}]},{id:"pergunta-3",model:"perguntas",title:"Cliente s\xF3 responde \u201Clegal\u201D",situation:"Voc\xEA explicou o produto todo e o cliente s\xF3 respondeu \u201Clegal\u201D, sem continuar. O que fazer?",options:[{text:"Esperar o cliente continuar sozinho",correct:!1,feedback:"\u201CLegal\u201D \xE9 uma resposta neutra \u2014 sem uma pergunta de volta, a conversa pode morrer ali."},{text:"\u201CQue bom que fez sentido! S\xF3 pra eu entender melhor: o que mais chamou sua aten\xE7\xE3o at\xE9 agora?\u201D",correct:!0,feedback:"Transforma uma resposta neutra numa pergunta que revela o interesse real por tr\xE1s dela."},{text:"Mandar o link de pagamento direto",correct:!1,feedback:"Pula etapas sem confirmar se o cliente est\xE1 realmente pronto pra decidir."}]},{id:"objecao-1",model:"objecoes",title:"\u201CJ\xE1 tenho um cart\xE3o parecido\u201D",situation:"Cliente diz: \u201Cj\xE1 tenho um cart\xE3o parecido.\u201D O que fazer?",options:[{text:"\u201CAh, tudo bem ent\xE3o.\u201D",correct:!1,feedback:"Desiste sem investigar se existe algum diferencial real a explorar."},{text:"\u201CQue bom que j\xE1 usa algo parecido! Me conta, o que voc\xEA mais gosta e o que sente falta no que j\xE1 tem?\u201D",correct:!0,feedback:"Investiga o que falta no concorrente antes a lembrar na pr\xF3xima vez que for pedir indica\xE7\xE3o a ele."}},{id:"b1l2",title:"Custo de aquisi\xE7\xE3o menor",theory:["Toda venda tem um custo por tr\xE1s \u2014 tempo de abordagem, deslocamento, liga\xE7\xF5es, tentativas que n\xE3o fecham. Na indica\xE7\xE3o, o cliente satisfeito j\xE1 filtrou o lead pra voc\xEA: ele s\xF3 indicou porque acha que vale a pena.","Isso significa menos esfor\xE7o pra fechar o mesmo resultado."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Quantas indica\xE7\xF5es voc\xEA recebeu no \xFAltimo m\xEAs sem pedir? Anote o n\xFAmero \u2014 \xE9 o seu ponto de partida."}},{id:"b1l3",title:"O momento certo de pedir",theory:["O erro mais comum \xE9 pedir indica\xE7\xE3o s\xF3 no fechamento, como um adendo apressado. Existem pelo menos tr\xEAs momentos melhores:","Pedir no momento certo pesa mais do que pedir com frequ\xEAncia."],dialogue:[],chips:[],exercise:{type:"quiz",prompt:"Um cliente comenta, sem voc\xEA perguntar nada, que ficou muito satisfeito com o atendimento. Qual \xE9 a melhor atitude?",options:[{text:"Aproveitar o momento e j\xE1 pedir a indica\xE7\xE3o ali mesmo",correct:!0,feedback:"Elogio espont\xE2neo \xE9 um dos melhores momentos pra pedir indica\xE7\xE3o \u2014 a satisfa\xE7\xE3o est\xE1 fresca e o cliente j\xE1 demonstrou isso sozinho."},{text:"Anotar mentalmente e pedir s\xF3 no pr\xF3ximo fechamento",correct:!1,feedback:"Esperar deixa a satisfa\xE7\xE3o esfriar. O momento de maior for\xE7a pra pedir \xE9 logo ali, n\xE3o depois."},{text:"N\xE3o comentar nada, esperando o cliente indicar sozinho",correct:!1,feedback:"A maioria dos clientes satisfeitos n\xE3o indica sozinha \u2014 ela precisa ser convidada a fazer isso."}]}}]},{id:"b2",title:"Mentalidade de Investimento",sub:"Vendedor de elite n\xE3o v\xEA bonifica\xE7\xE3o como custo \u2014 v\xEA como o que faz a indica\xE7\xE3o fechar.",lessons:[{id:"b2l1",title:"A conta que muda tudo",theory:["Um vendedor comum v\xEA R$100 saindo do pr\xF3prio bolso pra bonificar indica\xE7\xE3o e pensa em gasto. Um vendedor de elite enxerga isso como investimento \u2014 porque olha pro conjunto, n\xE3o pra indica\xE7\xE3o isolada.","Esse investimento n\xE3o fecha uma venda sozinho \u2014 ele soma. As indica\xE7\xF5es que ele gera entram junto com as vendas presenciais e os leads que voc\xEA j\xE1 trabalha, e \xE9 esse conjunto que te leva at\xE9 a r\xE9gua de volume que paga mais por venda fechada (por exemplo, bater 70 vendas no m\xEAs). O ganho n\xE3o est\xE1 numa indica\xE7\xE3o isolada \u2014 est\xE1 em cada indica\xE7\xE3o te aproximar da r\xE9gua seguinte.","A empresa j\xE1 entra com uma parte (o cashback de R$10 a R$15 por indica\xE7\xE3o fechada). O que voc\xEA soma por cima \xE9 o que faz a indica\xE7\xE3o sair do papel."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Somando presencial, leads e indica\xE7\xE3o, quantas vendas voc\xEA fecha hoje por m\xEAs? Quantas faltam pra voc\xEA chegar na pr\xF3xima r\xE9gua de pagamento \u2014 e quantas dessas podem vir de indica\xE7\xE3o bonificada?"},callouts:[{title:"Investimento x retorno",text:"Investimento mensal: R$100 \xB7 Indica\xE7\xF5es que ele gera: v\xE1rias \xB7 Resultado: uma r\xE9gua de pagamento acima."}]},{id:"b2l2",title:"A empresa j\xE1 te d\xE1 a largada",theory:["O Cart\xE3o de Todos j\xE1 disponibiliza leads e listas de contato pra trabalhar. Isso n\xE3o \xE9 o ponto de chegada \u2014 \xE9 o ponto de partida. Vendedor de elite n\xE3o espera s\xF3 isso: reinveste no que j\xE1 veio de gra\xE7a pra multiplicar o resultado.","O mesmo racioc\xEDnio vale pra ferramenta: quem investe em WhatsApp Business com API de disparo, ou em an\xFAncio no Meta, sem esperar iniciativa da empresa, entende uma coisa simples \u2014 quem embolsa o fruto da venda \xE9 ele, n\xE3o a empresa."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Voc\xEA j\xE1 trabalhou os leads que a empresa disponibilizou esse m\xEAs? Anote quantos contatos ainda est\xE3o parados."}},{id:"b2l3",title:"Menu de bonifica\xE7\xE3o al\xE9m do cashback",theory:["O cashback oficial (R$10\u201315) \xE9 o incentivo padr\xE3o. O que separa quem indica pouco de quem indica muito costuma ser o que o vendedor soma por conta pr\xF3pria. Alguns exemplos que funcionam bem, com investimento baixo e impacto alto:",'A l\xF3gica: escolher algo que o cliente sinta como cuidado pessoal, n\xE3o como "brinde de propaganda".'],dialogue:[],chips:["Consulta com ginecologista","Consulta com ortopedista","A\xE7a\xED na sorveteria parceira","Almo\xE7o num restaurante parceiro"],exercise:{type:"reflect",prompt:"Escolha uma bonifica\xE7\xE3o (da lista ou sua) que combina com o perfil dos seus clientes. Qual voc\xEA vai testar primeiro?"},callouts:[{title:"Menu de bonifica\xE7\xE3o sugerido",text:"Consulta com ginecologista \xB7 Consulta com ortopedista \xB7 A\xE7a\xED na sorveteria parceira \xB7 Almo\xE7o num restaurante parceiro"}]},{id:"b2l4",title:"Como pedir sem parecer chato",theory:["O jeito mais natural de pedir indica\xE7\xE3o \xE9 dentro da pr\xF3pria conversa \u2014 no momento certo, com o roteiro certo. Veja dois exemplos prontos que voc\xEA pode adaptar."],dialogue:[{label:"Presencial, logo ap\xF3s o cadastro",text:'"Seja bem-vindo(a) ao Cart\xE3o de Todos, [nome]! Deu certo o seu cadastro. Vou validar tudo agora, e a confirma\xE7\xE3o j\xE1 chega no seu WhatsApp. Enquanto isso, deixa eu j\xE1 te colocar na Promo\xE7\xE3o dos Amigos: todo amigo ou familiar que voc\xEA perceber que precisa de consulta ou exame, me manda o contato. A pessoa pode fechar o cadastro aqui comigo no escrit\xF3rio ou pelo meu WhatsApp \u2014 e como agora voc\xEA j\xE1 me conhece, pode falar pra ela que sou de confian\xE7a, sem d\xFAvida nenhuma. A cada indica\xE7\xE3o que fechar, cai R$15 de cashback no seu aplicativo, sempre entre o dia 15 e o dia 30 do m\xEAs. E n\xE3o para a\xED: a partir de 3 indica\xE7\xF5es fechadas no m\xEAs, voc\xEA entra no sorteio que eu fa\xE7o entre meus clientes no fim de cada m\xEAs \u2014 se for sorteado(a), escolhe o pr\xEAmio: a\xE7a\xED na sorveteria parceira, almo\xE7o no restaurante parceiro, ou consulta com ortopedista, ginecologista ou cl\xEDnico geral. Tem algu\xE9m que voc\xEA j\xE1 quer indicar agora?"'},{label:"WhatsApp, semanas depois",text:'"Oi [nome], tudo bem? Passando s\xF3 pra saber se voc\xEA j\xE1 usou o cart\xE3o. Aproveito pra lembrar: se algu\xE9m da sua fam\xEDlia ou do trabalho precisar, me manda o contato que eu cuido de tudo \u2014 e ainda tem uma bonifica\xE7\xE3o pra voc\xEA."'}],chips:[],exercise:{type:"quiz",prompt:"O cliente acabou de fechar o cadastro e est\xE1 visivelmente satisfeito. Qual abordagem funciona melhor?",options:[{text:"Pedir a indica\xE7\xE3o j\xE1 explicando a bonifica\xE7\xE3o, no calor do momento",correct:!0,feedback:"O momento logo ap\xF3s o fechamento, com a bonifica\xE7\xE3o clara, \xE9 quando o pedido soa mais natural e tem mais for\xE7a."},{text:"Deixar pra pedir s\xF3 depois que ele j\xE1 tiver usado o cart\xE3o algumas vezes",correct:!1,feedback:"Esperar \xE9 jogar contra voc\xEA mesmo \u2014 o entusiasmo do cliente \xE9 maior logo depois do fechamento."},{text:"Pedir indica\xE7\xE3o sem mencionar nenhuma bonifica\xE7\xE3o, pra n\xE3o parecer interesseiro",correct:!1,feedback:"Sem mencionar a bonifica\xE7\xE3o, voc\xEA perde o principal motivo pr\xE1tico que faz o cliente agir de verdade."}]}}]},{id:"b3",title:"WhatsApp Business Organizado",sub:"O WhatsApp \xE9 sua ferramenta de trabalho \u2014 organizar ele \xE9 parte da venda, n\xE3o um extra.",lessons:[{id:"b3l1",title:"Etiquetas que facilitam o dia a dia",theory:["Use sempre o WhatsApp Business \u2014 as etiquetas s\xF3 existem nele. Um conjunto simples que j\xE1 resolve a maior parte da rotina:","Padronizar as mesmas etiquetas em toda a equipe ajuda at\xE9 em caso de d\xFAvida \u2014 qualquer pessoa consegue achar o cliente certo rapidamente."],dialogue:[],chips:["Cliente Ativo","Indica\xE7\xE3o Pendente","Aguardando Fechamento","Aniversariante do M\xEAs","Precisa de Suporte"],exercise:{type:"reflect",prompt:"Quais etiquetas voc\xEA j\xE1 usa hoje no WhatsApp Business? O que ainda falta organizar?"},callouts:[{title:"Etiquetas sugeridas",text:"Cliente Ativo \xB7 Indica\xE7\xE3o Pendente \xB7 Aguardando Fechamento \xB7 Aniversariante do M\xEAs \xB7 Precisa de Suporte"}]},{id:"b3l2",title:"Salvar contato com nome e matr\xEDcula",theory:['Ao salvar o cliente, inclua a matr\xEDcula do cadastro junto ao nome (ex: "Maria SC311065541"). Isso evita perda de tempo se ele precisar de suporte no futuro e voc\xEA precisar localizar o cadastro rapidamente.'],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Pegue os \xFAltimos 5 contatos que voc\xEA salvou. Quantos t\xEAm a matr\xEDcula junto ao nome? Anote pra corrigir."}},{id:"b3l3",title:"Status como conex\xE3o, n\xE3o como an\xFAncio",theory:["O primeiro contato que o cliente teve com voc\xEA \u2014 presencial ou online \u2014 foi o que fez ele confiar o suficiente pra se cadastrar. O status \xE9 onde essa conex\xE3o continua depois da venda.","Antes de pensar em divulgar o cart\xE3o, pense em ser uma pessoa que o cliente reconhece e gosta de acompanhar:","\xC9 dentro desse fluxo natural \u2014 n\xE3o como post isolado \u2014 que entra o pedido de indica\xE7\xE3o, e ele funciona muito melhor assim."],dialogue:[],chips:[],exercise:{type:"quiz",prompt:"Qual \xE9 o jeito mais eficaz de usar o status do WhatsApp pra gerar indica\xE7\xE3o?",options:[{text:"Postar s\xF3 ofertas do cart\xE3o, todos os dias",correct:!1,feedback:"S\xF3 ofertas cansa o cliente r\xE1pido e ele para de prestar aten\xE7\xE3o no seu status."},{text:"Misturar conte\xFAdo pessoal \u2014 anivers\xE1rio, memes, bastidores \u2014 com o pedido de indica\xE7\xE3o de vez em quando",correct:!0,feedback:"A indica\xE7\xE3o funciona melhor quando vem dentro de uma conex\xE3o real com o cliente, n\xE3o como an\xFAncio isolado."},{text:"Nunca postar nada sobre o cart\xE3o, pra n\xE3o incomodar",correct:!1,feedback:"Sem nunca mencionar, voc\xEA perde a chance de lembrar o cliente de que ele pode te ajudar."}]}}]},{id:"b4",title:"Fechando Venda \xE0 Dist\xE2ncia",sub:"Venda online exige outro ritmo \u2014 a confian\xE7a precisa ser constru\xEDda s\xF3 com texto e \xE1udio.",lessons:[{id:"b4l1",title:"Presencial x online: o que muda",theory:["No presencial, sua presen\xE7a j\xE1 resolve boa parte da confian\xE7a. Online, cada palavra escrita precisa carregar esse peso sozinha. Isso pede mais paci\xEAncia e menos pressa pra fechar."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Qual foi a \xFAltima venda online que voc\xEA fez? O que foi mais dif\xEDcil de transmitir s\xF3 por texto?"}},{id:"b4l2",title:"Tirando d\xFAvida por texto e \xE1udio",theory:["Prefira \xE1udios curtos pra explicar algo que teria muito texto \u2014 humaniza a conversa sem perder tempo. Reserve o texto pra confirma\xE7\xF5es, valores e links, onde a pessoa vai querer reler."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Escreva um roteiro curto de \xE1udio que voc\xEA usaria pra explicar o cart\xE3o a um cliente novo."}},{id:"b4l3",title:"Enviando o link de pagamento",theory:["Envie o link s\xF3 depois de o cliente confirmar entendimento \u2014 nunca como primeira resposta. Acompanhe de uma frase curta refor\xE7ando o que ele est\xE1 resolvendo ao fechar, n\xE3o s\xF3 o valor."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Pensando na pr\xF3xima venda online, o que voc\xEA vai confirmar antes de mandar o link de pagamento?"}},{id:"b4l4",title:"Follow-up sem ser insistente",theory:['Follow-up \xE9 o acompanhamento que voc\xEA faz depois do primeiro contato \u2014 quando o cliente ainda n\xE3o respondeu ou n\xE3o fechou. Em portugu\xEAs seria algo como "retomar contato" ou "dar seguimento". A ideia n\xE3o \xE9 cobrar, \xE9 manter a porta aberta sem deixar o cliente esquecido.'],dialogue:[{label:"1 dia depois, sem resposta",text:'"Oi [nome], tudo bem? Passando aqui pra saber se ficou alguma d\xFAvida sobre o cadastro \u2014 voc\xEA ainda tem interesse em finalizar?"'},{label:"3-4 dias depois",text:'"Oi [nome], separei uma condi\xE7\xE3o especial pra voc\xEA fechar: cadastro no d\xE9bito com 50% de desconto na ades\xE3o \u2014 fica s\xF3 R$33,40. \xC9 por tempo limitado, n\xE3o queria que voc\xEA perdesse. Vamos confirmar seu cadastro nessa condi\xE7\xE3o?"'}],chips:[],exercise:{type:"quiz",prompt:"O cliente n\xE3o responde h\xE1 4 dias. Qual mensagem tem mais chance de reengajar sem parecer chato?",options:[{text:"Cobrar diretamente, perguntando por que ele n\xE3o respondeu",correct:!1,feedback:"Cobrar soa como press\xE3o e tende a afastar ainda mais quem j\xE1 estava em d\xFAvida."},{text:"Oferecer uma condi\xE7\xE3o especial por tempo limitado, sem soar como cobran\xE7a",correct:!0,feedback:"Uma oferta com prazo d\xE1 um motivo real pra resposta, sem parecer insist\xEAncia."},{text:"N\xE3o mandar mais nada e esperar ele voltar a falar",correct:!1,feedback:"Sil\xEAncio total geralmente significa perder o cliente de vez \u2014 vale um \xFAltimo gancho."}]}}]},{id:"b5",title:"Rotina e M\xE9tricas",sub:"O que n\xE3o \xE9 medido, n\xE3o repete. Uma rotina simples sustenta o resultado.",lessons:[{id:"b5l1",title:"Meta semanal de indica\xE7\xE3o",theory:["Defina um n\xFAmero m\xEDnimo de pedidos de indica\xE7\xE3o por semana \u2014 n\xE3o de fechamentos, de pedidos. \xC9 a a\xE7\xE3o que voc\xEA controla; o fechamento depende tamb\xE9m do outro lado."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Qual vai ser sua meta de pedidos de indica\xE7\xE3o essa semana? Escreva o n\xFAmero."}},{id:"b5l2",title:"Meta de leads online",theory:["Separe uma meta pr\xF3pria pra leads que vieram do WhatsApp/redes, diferente da indica\xE7\xE3o. S\xE3o canais com ritmos diferentes e merecem acompanhamento separado."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Qual vai ser sua meta de leads online essa semana? Escreva o n\xFAmero."}},{id:"b5l3",title:"Registro simples",theory:["Uma planilha ou as etiquetas do pr\xF3prio WhatsApp j\xE1 bastam. O importante \xE9 conseguir responder r\xE1pido: quantas indica\xE7\xF5es pedi essa semana, quantas fecharam, quantos leads online entraram."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"Como voc\xEA vai registrar isso \u2014 planilha, etiquetas, caderno? Escreva o m\xE9todo que vai usar a partir de agora."}}]}]},recepcao:{blocks:[{id:"r1",title:"Divulga\xE7\xE3o em Grupos e Redes Locais",sub:"Ir at\xE9 onde as pessoas do bairro j\xE1 est\xE3o, em vez de esperar elas passarem na porta.",lessons:[{id:"r1l1",title:"Grupos de WhatsApp e Facebook",theory:['Poste em grupos de bairro e comunidade com um dia e hor\xE1rio fixo de atendimento presencial. Fixar uma rotina (ex: "toda quinta, cadastro r\xE1pido no escrit\xF3rio") cria previsibilidade \u2014 as pessoas passam a lembrar do dia certo.'],dialogue:[],chips:[],exercise:{type:"quiz",prompt:"Qual pr\xE1tica ajuda mais a fazer as pessoas lembrarem do dia de atendimento presencial?",options:[{text:"Postar em hor\xE1rios e dias aleat\xF3rios, sem padr\xE3o",correct:!1,feedback:"Sem padr\xE3o, ningu\xE9m memoriza o dia certo de ir at\xE9 o escrit\xF3rio."},{text:"Fixar um dia e hor\xE1rio fixo, e repostar sempre no mesmo padr\xE3o",correct:!0,feedback:"Previsibilidade cria h\xE1bito \u2014 quando o dia \xE9 sempre o mesmo, as pessoas passam a esperar por ele."},{text:"Postar s\xF3 uma vez e n\xE3o repetir",correct:!1,feedback:"Uma postagem \xFAnica some do feed r\xE1pido e n\xE3o constr\xF3i lembran\xE7a nenhuma."}]}},{id:"r1l2",title:"Status mostrando o escrit\xF3rio por dentro",theory:["Quem nunca foi tem receio de n\xE3o saber o que esperar. Mostrar o espa\xE7o, a equipe e o atendimento nos Stories reduz essa barreira antes mesmo da pessoa chegar."],dialogue:[],chips:[],exercise:{type:"reflect",prompt:"O que voc\xEA mostraria no status pra algu\xE9m que nunca veio ao escrit\
